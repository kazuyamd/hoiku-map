name: 月次データ更新
on:
  schedule:
    - cron: '7 1 1,2,3 * *'   # 毎月1〜3日 10:07 JST（市の公開が遅れても拾う）
  workflow_dispatch: {}       # Actions画面から手動実行も可
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 最新CSVからdata.jsonを作成
        run: python3 update.py geo.json data.json
      - name: 変更があればコミット
        run: |
          if git diff --quiet data.json; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "データ更新: $(python3 -c "import json;print(json.load(open('data.json'))['asof'])")"
          git push
